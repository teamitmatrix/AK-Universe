<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérifiez vos e-mails — AK Universe</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="light">

<div class="auth">
  <aside class="auth-side">
    <div class="ph ph-m9 ph-man" aria-hidden="true"></div>
    <a href="index.html" class="logo"><img src="assets/img/logo.svg" alt=""><span><span class="ak">AK</span> UNIVERSE</span></a>
    <div class="copy">
      <h2>Bienvenue sur<br><span class="gold">AK Universe</span></h2>
      <p>Accédez à votre espace et gérez tous vos agents IA en toute simplicité.</p>
    </div>
  </aside>

  <main class="auth-main">
    <div class="light-top">
      <div class="lang">
        <button class="lang-btn" aria-haspopup="true" aria-expanded="false"><span class="flag"><i style="background:#1f4fb4"></i><i style="background:#fff"></i><i style="background:#e03a3e"></i></span><span class="lang-label">Français</span> <i data-i="chev-down"></i></button>
        <ul class="lang-menu">
          <li><button data-label="Français"><span class="flag"><i style="background:#1f4fb4"></i><i style="background:#fff"></i><i style="background:#e03a3e"></i></span> Français</button></li>
          <li><button data-label="English"><span class="flag" style="flex-direction:column"><i style="background:#c8102e"></i><i style="background:#fff"></i><i style="background:#012169"></i></span> English</button></li>
        </ul>
      </div>
    </div>

    <form class="auth-form center" id="otp-form">
      <h1>Vérifiez vos e-mails</h1>
      <p class="sub">Nous avons envoyé un code de connexion à<br><b id="otp-email" style="color:var(--l-text)">votre adresse e-mail</b></p>

      <div class="otp" role="group" aria-label="Code à 6 chiffres">
        <input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Chiffre 1">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 2">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 3">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 4">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 5">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Chiffre 6">
      </div>

      <button type="submit" class="btn btn-light-primary btn-block">Se connecter <i data-i="arrow"></i></button>
      <p class="resend">Le code expire après 15 minutes. <button type="button" id="resend" class="link-orange">Renvoyer un code</button></p>
    </form>
  </main>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
